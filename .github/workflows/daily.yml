name: Daily Topic Picker
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: pip install -r requirements.txt
      - name: gen
        run: python main.py
 - name: render
        run: bash -c "mkdir -p public && python html_render.py --index public/ && for md in output/*.md; do n=$(basename $md .md); python html_render.py $md public/$n.html; done"
 - name: push
        run: bash -c "git config user.name bot && git config user.email bot@users.noreply.github.com && git add -A && (git diff --staged --quiet && echo no-changes || (git commit -m daily && git push))"
